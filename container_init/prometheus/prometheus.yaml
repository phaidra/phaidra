global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: docker
    static_configs:
      - targets: ["host.docker.internal:9323","node-exporter:9100","cadvisor:8080"]

  - job_name: httpd
    static_configs:
      - targets: ["apache-exporter:9117"]

  - job_name: 'fcrepo'
    scrape_interval: 30s
    metrics_path: '/fcrepo/prometheus'
    static_configs:
      - targets: ['fedora:8080']
    basic_auth:
      username: ${FEDORA_ADMIN_USER}
      password: ${FEDORA_ADMIN_PASS} 

  - job_name: mojo
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ["api:3000"]
    basic_auth:
      username: ${PHAIDRA_ADMIN_USER}
      password: ${PHAIDRA_ADMIN_PASSWORD}

  - job_name: varnish
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets: ["varnish:9131"]
