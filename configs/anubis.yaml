---
bots:
  - name: impressum
    path_regex: ^/(impressum|termsofuse|credits)
    action: ALLOW

  - name: univie
    expression: 'verifyFCrDNS(remoteAddress, "univie\\.ac\\.at$")'
    action: ALLOW

  - import: (data)/common/allow-private-addresses.yaml
  - import: (data)/common/keep-internet-working.yaml
  - import: (data)/crawlers/allow-good.yaml

  - name: catchall
    path_regex: .*
    action: CHALLENGE
    challenge:
      difficulty: 4
      algorithm: fast
