<IfModule !proxy_wstunnel_module>
  LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
</IfModule>
<IfModule !rewrite_module>
  LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

<IfDefine ACME>
  LoadModule watchdog_module modules/mod_watchdog.so
  LoadModule md_module modules/mod_md.so
  LoadModule http2_module modules/mod_http2.so

  <IfModule ssl_module>
    SSLEngine on
    MDStoreDir /mnt/mdcerts
    <MDomain ${PHAIDRA_HOSTNAME}>
      MDCertificateAuthority ${CA_ENDPOINT}
      <IfDefine ACME_EAB>
        MDExternalAccountBinding ${HTTPD_ACME_KEYID} ${HTTPD_ACME_HMAC64}
      </IfDefine>
      MDCAChallenges tls-alpn-01
      Protocols h2 http/1.1 acme-tls/1
      ServerAdmin ${PHAIDRA_ADMIN_EMAIL}
      MDCertificateAgreement ${MD_CERTIFICATE_AGREEMENT}
    </MDomain>
  </IfModule>
</IfDefine>

<IfDefine !ACME>
  <IfModule ssl_module>
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/server.key"
  </IfModule>
</IfDefine>

<IfDefine PFSA>
  ProxyPass /pfsa !
  Alias "/pfsa" "/mnt/pfsa"
  <Directory "/mnt/pfsa">
    SetOutputFilter RATE_LIMIT
    SetEnv rate-limit ${HTTPD_RATE_LIMIT}
    SetEnv rate-initial-burst ${HTTPD_RATE_LIMIT_BURST}
    Options Indexes
    AllowOverride None
    Require all granted
  </Directory>
</IfDefine>

<IfDefine PFSA_REDIRECT>
  ProxyPass /pfsa !
  RedirectMatch 302 ^/pfsa(/.*)?$ https://${HTTPD_PFSA_REDIRECT_FQDN}/pfsa$1
</IfDefine>

<IfModule headers_module>
  # Excludes: /dbgate, /grafana, /lam, /fcrepo, /solr, /sitemap, /static
  <LocationMatch "^/(?!dbgate|grafana|lam|fcrepo|solr|sitemap|static).*">
    Header set Content-Security-Policy "${HTTPD_CSP}"
  </LocationMatch>
</IfModule>

<IfModule rewrite_module>
  RewriteEngine On
  # Route only websocket upgrade requests for Nuxt HMR to UI.
  RewriteCond %{REQUEST_URI} ^/_nuxt/ [NC]
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteRule ^/(.*)$ ws://ui:3001/$1 [P,L]
</IfModule>

<IfDefine NOINDEX>
  Header always set X-Robots-Tag "noindex, nofollow"
</IfDefine>