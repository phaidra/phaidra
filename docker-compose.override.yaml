name: phaidra

include:
  - docker-compose.yaml

services:
  httpd-ssl-local:
    extends:
      file: docker-compose.yaml
      service: httpd-ssl-local
    ports: !reset []
    expose:
      - 443
  httpd-shib-local:
    extends:
      file: docker-compose.yaml
      service: httpd-shib-local
    ports: !reset []
    expose:
      - 443

  prometheus:
    extends:
      file: docker-compose.yaml
      service: prometheus
    build:
      context: .
      dockerfile: dockerfiles/prometheus-dist.dockerfile
    pull_policy: build

  caddy:
    hostname: caddy
    build:
      context: .
      dockerfile_inline: |
        FROM caddy:builder AS builder
        RUN --mount=type=cache,target=/go/pkg/mod --mount=type=cache,target=/root/.cache/go-build xcaddy build --with github.com/oltdaniel/caddy-ipinfo-free --with github.com/mholt/caddy-ratelimit

        FROM alpine AS ip_db_converter
        RUN apk add --no-cache go
        RUN go install github.com/ipinfo/mmdbctl@mmdbctl-1.4.10
        ADD https://iptoasn.com/data/ip2asn-combined.tsv.gz /tmp/ip2asn-combined.tsv.gz
        RUN gunzip /tmp/ip2asn-combined.tsv.gz

        RUN /root/go/bin/mmdbctl import --range-multicol -t -f asn,country_code,as_name /tmp/ip2asn-combined.tsv /tmp/GeoLite2-Country.mmdb

        FROM caddy
        COPY --from=builder /usr/bin/caddy /usr/bin/caddy
        COPY --from=ip_db_converter /tmp/GeoLite2-Country.mmdb /srv/GeoLite2-Country.mmdb
        COPY --from=ip_db_converter /tmp/GeoLite2-Country.mmdb /srv/ipinfo_lite.mmdb
        COPY --from=ip_db_converter /tmp/ip2asn-combined.tsv /srv/ip2asn-combined.tsv
    pull_policy: build
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - phaidra-network
    restart: always
    command: ["/usr/bin/caddy", "run", "--config", "/Caddyfile"]
    environment:
      PHAIDRA_HOSTNAME: "${PHAIDRA_HOSTNAME}"
      CADDY_LOG_LEVEL: "${CADDY_LOG_LEVEL:-DEBUG}"
      # leave for EU countries, otherwise set in .env a list of country code ie "AT DE"
      CADDY_DENY_COUNTRIES: "${CADDY_DENY_COUNTRIES:-}"
    volumes:
      - ./certs/httpd:/ssl:ro
    configs:
      - source: caddyfile
        target: /Caddyfile
    profiles: ["ssl-local", "shib-local"]

  anubis:
    hostname: "botblocker"
    image: ghcr.io/techarohq/anubis:latest
    # explicitly set labels restart, networks because it's not possible to use anchor when including compose files
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    restart: always
    networks:
      - phaidra-network
    environment:
      COOKIE_SECURE: true
      TARGET: https://httpd:443
      TARGET_INSECURE_SKIP_VERIFY: true
      SLOG_LEVEL: "${ANUBIS_LOG_LEVEL:-WARN}"
      REDIRECT_DOMAINS: "${PHAIDRA_HOSTNAME}"
      DIFFICULTY: 5
      POLICY_FNAME: /data/cfg/botPolicy.yaml
      BIND: ":8080"
    volumes:
      - ./configs/anubis.yaml:/data/cfg/botPolicy.yaml:ro
    develop:
      watch:
        - path: ./configs/anubis.yaml
          target: /data/cfg/botPolicy.yaml
          action: sync+restart
          initial_sync: true
    # profiles: [ssl-local, shib-local]
    profiles: ["anubis"]

  goaway:
    hostname: "botblocker"
    image: ghcr.io/weebdatahoarder/go-away:latest
    # explicitly set labels restart, networks because it's not possible to use anchor when including compose files
    labels:
      logging: "promtail"
      logging_jobname: "containerlogs"
    restart: always
    networks:
      - phaidra-network
    environment:
      GOAWAY_BIND: ":8080"
      GOAWAY_CACHE: "/cache"
      GOAWAY_CLIENT_IP_HEADER: "X-Real-Ip"
      GOAWAY_POLICY: /policy.yaml
      GOAWAY_BACKEND: "*=http://httpd:443"
    volumes:
      - goaway_cache:/cache
      - ./configs/goaway.yaml:/policy.yaml
    profiles: ["goaway"]

configs:
  caddyfile:
    content: |
      {
        auto_https disable_certs
        metrics
        servers {
          timeouts {
            read_header 5s
            idle 1m
          }
        }
        order ipinfo_free first
        ipinfo_free_config {
            url https://ipinfo.io/data/ipinfo_lite.mmdb?token=ALWAYSFAIL
            # run it as few times as possible as it will always fail
            cron "10 10 10 10 *"
            path /srv/
            error_on_invalid_ip true
        }
      }
      # not sure why we have to manually redirect. maybe because of caddy?
      # $PHAIDRA_HOSTNAME:80 {
      #   redir "https://localhost"
      # }
      $PHAIDRA_HOSTNAME {
        ipinfo_free forwarded
        header X-Forwarded-For 131.130.2.176

        @CADDY_DENY_COUNTRIES vars {ipinfo_free.country_code} "DONT_FAIL_ON_EMPTY_VAR" $CADDY_DENY_COUNTRIES
        tls /ssl/fullchain.pem /ssl/privkey.pem {
        }
        # reverse_proxy http://botblocker:8080 {

        route {
          rate_limit {
            zone asn {
              key {ipinfo_free.asn}
              events 10000
              window 1h
              log_key true
            }
          }
          header @CADDY_DENY_COUNTRIES  Content-Type text/html
          respond @CADDY_DENY_COUNTRIES 401 {
            body <<EOF
              <html>
                <h3> You have been blocked </h3>
                If you believe this to be in error, contact https://rdm.univie.ac.at/de/repositorium-phaidra/support-und-training/
                <pre>
                Impressum

                Publication according to § 25 MedG - (Section 25 of Austrian Media Code) responsible for the content of this page:

                University of Vienna
                Library and archive services
                Universitätsring 1
                A-1010 Vienna
                Austria

                If you have technical problems, please contact the helpdesk:
                T +43-1-4277-140 60
                F +43-1-4277-140 60

                Send an E-Mail to us:
                eMailsupport.phaidra@univie.ac.at
                Webhttp://www.ub.univie.ac.at/

                Phaidra does not assume responsibility for linked content or external pages.

                © Copyright UB
                </pre>
              </html>
            EOF
          }
          reverse_proxy http://botblocker:8080 {
            # transport http {
            #   tls_insecure_skip_verify
            # }
            header_up X-Real-Ip {http.request.remote.host}
          }
        }
        log {
          level $CADDY_LOG_LEVEL
        }
        log_append asn "{ipinfo_free.asn}"
        log_append country_code "{ipinfo_free.country_code}"
        log_append as_name "{ipinfo_free.as_name}"
      }

      :8999 {
        metrics
      }

volumes:
  goaway_cache:
